{% extends 'base.html' %}{% block content %}<h2>{{tr('Attendance')}}</h2><div class="card"><form method="post"><label>{{tr('Month')}}</label><input type="month" name="month" value="{{month}}"><br><div class="table-wrap"><table><tr><th>ID</th><th>{{tr('Name')}}</th><th>{{tr('Department')}}</th><th>{{tr('Present')}}</th><th>{{tr('Absent')}}</th><th>{{tr('OT Hours')}}</th></tr>{% for w in data %}<tr><td>{{w['id']}}</td><td>{{w['bangla_name'] or w['name']}}</td><td>{{dept(w['department'])}}</td><td><input type="number" min="0" name="present_{{w['id']}}" value="{{w['present_days']}}"></td><td><input type="number" min="0" name="absent_{{w['id']}}" value="{{w['absent_days']}}"></td><td><input type="number" min="0" step="0.25" name="ot_{{w['id']}}" value="{{w['ot_hours']}}"></td></tr>{% endfor %}</table></div><br><button>{{tr('Save')}}</button></form></div>{% endblock %}
